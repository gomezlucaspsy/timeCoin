<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#000000"/>

  <!-- motion trail -->
  <g stroke="#10b981" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="128" y1="360" x2="172" y2="316"/>
    <line x1="158" y1="392" x2="202" y2="348"/>
  </g>
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.3">
    <line x1="100" y1="326" x2="140" y2="286"/>
  </g>

  <!-- wings -->
  <path d="M172 246 C120 232 88 250 70 288 C104 280 138 282 168 300 Z" fill="#10b981"/>
  <path d="M340 246 C392 232 424 250 442 288 C408 280 374 282 344 300 Z" fill="#10b981"/>

  <!-- banknote -->
  <g transform="rotate(-14 256 246)">
    <rect x="146" y="186" width="220" height="120" rx="16" fill="#ffffff"/>
    <rect x="146" y="186" width="220" height="120" rx="16" fill="none" stroke="#000000" stroke-width="4" opacity="0.08"/>
    <!-- clock face standing in for the bill's portrait -->
    <circle cx="256" cy="246" r="34" fill="none" stroke="#000000" stroke-width="6"/>
    <line x1="256" y1="246" x2="256" y2="224" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="246" x2="272" y2="252" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <!-- corner value marks -->
    <text x="166" y="212" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#000000">TC</text>
    <text x="322" y="298" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#000000">TC</text>
  </g>
</svg>
