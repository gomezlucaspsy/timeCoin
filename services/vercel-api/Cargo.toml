[package]
name = "timecoin-vercel-api"
version = "0.1.0"
edition = "2021"

[dependencies]
economy-lib = { path = "economy-lib" }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vercel_runtime = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Each Vercel Rust function is its own binary, one per file in api/.
[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "verify-and-mint"
path = "api/verify-and-mint.rs"
