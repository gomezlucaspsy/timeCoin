[package]
name = "timecoin-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
economy-lib = { path = "../vercel-api/economy-lib" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
